[package]
name = "findbar"
version = "0.1.0"
edition = "2024"
description = "Declarative and standalone macOS Finder sidebar favorites manager"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
shellexpand = "3.1"
anyhow = "1.0"
thiserror = "2.0"
colored = "3.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

